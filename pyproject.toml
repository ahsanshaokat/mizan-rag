[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mizan-rag"
version = "0.1.0"
description = "A complete RAG pipeline built on Mizan Similarity, MizanEmbedder, and MizanVector."
authors = [{ name = "Ahsan Shaokat", email = "your-email@example.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
    "torch>=1.12",
    "mizan-vector>=0.1.0",
    "mizan-embedder>=0.1.0",
    "sentence-transformers>=2.2.2",
    "numpy",
    "tqdm",
    "requests",
    "transformers>=4.36",
    "accelerate"
]

# OPTIONAL LLM PROVIDER SUPPORT
[project.optional-dependencies]
llm = [
    "openai",
    "groq",
    "xai-sdk",
    "openrouter>=0.5.0",
]

dev = [
    "pytest",
    "black",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/yourusername/mizan-rag"
Documentation = "https://github.com/yourusername/mizan-rag"
Source = "https://github.com/yourusername/mizan-rag"

# OPTIONAL CLI ENTRYPOINT
[project.scripts]
mizanrag = "mizan_rag.cli:main"
